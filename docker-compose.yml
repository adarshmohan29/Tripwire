x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://tripwire:tripwire@db:5432/tripwire
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tripwire
      POSTGRES_PASSWORD: tripwire
      POSTGRES_DB: tripwire
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tripwire"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    <<: *app
    command: npm run api
    ports:
      - "3000:3000"

  worker:
    <<: *app
    command: npm run worker

  mock:
    <<: *app
    command: npm run mock
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://tripwire:tripwire@db:5432/tripwire
      PORT: "4000"
      MOCK_FAIL_RATE: ${MOCK_FAIL_RATE:-0}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
      MOCK_DEDUPE: ${MOCK_DEDUPE:-true}

  # Separate from db so running workers never claim test events and tests never leave rows in
  # the stack's data. tmpfs keeps it in memory: fast, and empty whenever the container is recreated.
  testdb:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: tripwire
      POSTGRES_PASSWORD: tripwire
      POSTGRES_DB: tripwire_test
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tripwire"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    <<: *app
    command: npm test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgres://tripwire:tripwire@testdb:5432/tripwire_test
    depends_on:
      testdb:
        condition: service_healthy
